[project]
name = "uit-vsfc"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "underthesea>=9.5.0",
    "transformers>=5.20.2,<6",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
    "joblib>=1.6.0",
]
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
